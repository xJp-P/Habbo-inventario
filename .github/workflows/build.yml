name: Instaladores

# Se ejecuta al subir una etiqueta de version (v1.0.0, v1.1.0...) o a mano desde la
# pestaña Actions. Compila Windows (x64) y Mac (Apple Silicon e Intel) en paralelo y,
# cuando ambos terminan, el ultimo paso arma UN solo Release en BORRADOR con todo: los
# instaladores, latest.yml y latest-mac.yml (lo que leen las apps instaladas para
# actualizarse) y las notas de esa version sacadas del CHANGELOG.
#
# Por que un paso final: si cada sistema publicara por su cuenta, los dos crearian su
# propio borrador al mismo tiempo y los archivos quedarian repartidos.
#
# Nada llega a los equipos hasta que publicas el borrador en la pestaña Releases.
# La version sale del package.json: la etiqueta debe coincidir (v + version).
#
# OJO: al publicar el borrador, GitHub crea la etiqueta v<version> y esa etiqueta vuelve a
# disparar este workflow. Hasta la 1.5.0 esa segunda ejecucion compilaba todo otra vez y
# fallaba al final («ya esta publicada»). Ahora el primer trabajo (revisar) lo detecta y
# termina en verde sin compilar nada; si la version ya publicada se pide a mano (Run
# workflow), falla ahi mismo, antes de gastar minutos en compilar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide si hay algo que compilar: `compilar` = true salvo que la version del
  # package.json ya este publicada.
  revisar:
    runs-on: ubuntu-latest
    outputs:
      compilar: ${{ steps.version.outputs.compilar }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Revisar la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$EVENTO" = "push" ] && [ "$ETIQUETA" != "$TAG" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la version del package.json ($TAG)."
            exit 1
          fi
          # Este endpoint solo devuelve Releases PUBLICADOS (los borradores dan 404).
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            if [ "$EVENTO" = "push" ]; then
              echo "::notice::$TAG ya esta publicada: esta ejecucion la disparo la etiqueta que GitHub crea al publicar el borrador. No hay nada que compilar."
              echo "compilar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::La version $TAG ya esta publicada: sube la version en package.json y en el CHANGELOG."
            exit 1
          fi
          echo "compilar=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: revisar
    if: needs.revisar.outputs.compilar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar el instalador .exe
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  mac:
    needs: revisar
    if: needs.revisar.outputs.compilar == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sin nombrar formatos en la linea de comandos: asi electron-builder usa los del
      # package.json (dmg y zip, cada uno en arm64 y x64). Con "--mac dmg zip" compila
      # solo la arquitectura de la maquina (arm64) y Mac Intel se queda sin instalador.
      - name: Compilar .dmg y .zip (Apple Silicon e Intel)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # Un solo Release para todo. Si ya hay BORRADORES de esta version, se reemplazan; si
  # ya esta PUBLICADA (alguien la publico mientras se compilaba), el paso falla sin tocarla.
  publicar:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Crear el Release en borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          ls -la instaladores
          for f in "Habbo-Inventario-Windows-$VERSION.exe" latest.yml latest-mac.yml \
                   "Habbo-Inventario-Mac-$VERSION-arm64.dmg" "Habbo-Inventario-Mac-$VERSION-x64.dmg" \
                   "Habbo-Inventario-Mac-$VERSION-arm64.zip" "Habbo-Inventario-Mac-$VERSION-x64.zip"; do
            test -f "instaladores/$f" || { echo "Falta $f"; exit 1; }
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::La version $TAG se publico mientras se compilaba: no se toca."
            exit 1
          fi
          # --paginate: con mas de 30 Releases, la primera pagina no los trae todos.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id"); do
            echo "Reemplazo el borrador anterior $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f && !/^\[[^]]+\]: /' CHANGELOG.md > notas.md
          gh release create "$TAG" instaladores/* --draft --target "$GITHUB_SHA" \
            --title "Habbo Inventario $VERSION" --notes-file notas.md
