name: Instaladores

# Se ejecuta al subir una etiqueta de version (v1.0.0, v1.1.0...) o a mano desde la
# pestaña Actions. Genera el .exe de Windows y los .dmg/.zip de Mac (Apple Silicon e
# Intel) y los sube a un Release en BORRADOR de GitHub, junto con latest.yml y
# latest-mac.yml (lo que leen las apps instaladas para actualizarse).
#
# Nada llega a los equipos hasta que publicas el borrador en la pestaña Releases.
# La version sale del package.json: la etiqueta debe coincidir (v + version).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar y subir el instalador .exe
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: dist/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar y subir .dmg + .zip
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Mac
          path: |
            dist/*.dmg
            dist/*.zip
