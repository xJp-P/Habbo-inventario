name: Instaladores

# Se ejecuta al publicar una etiqueta de version (v0.1.0, v0.2.0...) o a mano desde la
# pestaña Actions. Genera el .exe de Windows y los .dmg/.zip de Mac (Apple Silicon e
# Intel) y los sube como borrador de Release en GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Compilar y publicar instalador .exe
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: dist/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Compilar y publicar .dmg + .zip
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Mac
          path: |
            dist/*.dmg
            dist/*.zip
